<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="t d">
  <title id="t">7 điểm kiểm tra trên nhãn túi cà phê</title>
  <desc id="d">Checklist bảy điểm theo thứ tự quan trọng: ngày rang, cách sơ chế, xuất xứ, loại hạt và giống, thành phần, mức rang, bao bì. Hai dòng quan trọng nhất là ngày rang và cách sơ chế.</desc>
  <rect width="640" height="480" fill="#f7efe6"/>
<text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#4a2c14" font-weight="bold">7 điểm kiểm tra trên nhãn túi cà phê</text>
<rect x="60" y="60" width="520" height="44" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<rect x="74" y="72" width="20" height="20" fill="#ffffff" stroke="#4a2c14" stroke-width="2" rx="0"/>
<text x="106" y="78" text-anchor="start" font-family="sans-serif" font-size="15" fill="#4a2c14" font-weight="bold">1. Ngày rang</text>
<text x="106" y="96" text-anchor="start" font-family="sans-serif" font-size="13" fill="#555">Mua trong 2 tuần sau khi rang</text>
<rect x="60" y="112" width="520" height="44" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<rect x="74" y="124" width="20" height="20" fill="#ffffff" stroke="#4a2c14" stroke-width="2" rx="0"/>
<text x="106" y="130" text-anchor="start" font-family="sans-serif" font-size="15" fill="#4a2c14" font-weight="bold">2. Cách sơ chế</text>
<text x="106" y="148" text-anchor="start" font-family="sans-serif" font-size="13" fill="#555">Washed, natural, honey hoặc semi-washed</text>
<rect x="60" y="164" width="520" height="44" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<rect x="74" y="176" width="20" height="20" fill="#ffffff" stroke="#4a2c14" stroke-width="2" rx="0"/>
<text x="106" y="182" text-anchor="start" font-family="sans-serif" font-size="15" fill="#4a2c14" font-weight="bold">3. Xuất xứ</text>
<text x="106" y="200" text-anchor="start" font-family="sans-serif" font-size="13" fill="#555">Quốc gia, vùng, tốt nhất có tên nông trại</text>
<rect x="60" y="216" width="520" height="44" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<rect x="74" y="228" width="20" height="20" fill="#ffffff" stroke="#4a2c14" stroke-width="2" rx="0"/>
<text x="106" y="234" text-anchor="start" font-family="sans-serif" font-size="15" fill="#4a2c14" font-weight="bold">4. Loại hạt và giống</text>
<text x="106" y="252" text-anchor="start" font-family="sans-serif" font-size="13" fill="#555">Robusta hay Arabica; Bourbon, Typica, SL28</text>
<rect x="60" y="268" width="520" height="44" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<rect x="74" y="280" width="20" height="20" fill="#ffffff" stroke="#4a2c14" stroke-width="2" rx="0"/>
<text x="106" y="286" text-anchor="start" font-family="sans-serif" font-size="15" fill="#4a2c14" font-weight="bold">5. Thành phần</text>
<text x="106" y="304" text-anchor="start" font-family="sans-serif" font-size="13" fill="#555">Ghi “100% cà phê”; không bơ, hương liệu, đậu nành</text>
<rect x="60" y="320" width="520" height="44" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<rect x="74" y="332" width="20" height="20" fill="#ffffff" stroke="#4a2c14" stroke-width="2" rx="0"/>
<text x="106" y="338" text-anchor="start" font-family="sans-serif" font-size="15" fill="#4a2c14" font-weight="bold">6. Mức rang</text>
<text x="106" y="356" text-anchor="start" font-family="sans-serif" font-size="13" fill="#555">Light, medium, dark hoặc rang sáng, vừa, đậm</text>
<rect x="60" y="372" width="520" height="44" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<rect x="74" y="384" width="20" height="20" fill="#ffffff" stroke="#4a2c14" stroke-width="2" rx="0"/>
<text x="106" y="390" text-anchor="start" font-family="sans-serif" font-size="15" fill="#4a2c14" font-weight="bold">7. Bao bì</text>
<text x="106" y="408" text-anchor="start" font-family="sans-serif" font-size="13" fill="#555">Túi có van một chiều, kín, không thủng</text>
<text x="320" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Hai dòng quan trọng nhất: ngày rang và cách sơ chế.</text>
<text x="320" y="468" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Hình minh họa được vẽ riêng cho website — không phải ảnh chụp thật</text>
</svg>
