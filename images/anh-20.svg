<svg xmlns="http://www.w3.org/2000/svg" width="640" height="354" viewBox="0 0 640 354" role="img" aria-labelledby="t d">
  <title id="t">Khử caffeine bằng cách nào</title>
  <desc id="d">Ba phương pháp khử caffeine: dung môi từ đầu những năm 1900 loại bỏ 96–97%; nước Thụy Sĩ thương mại từ đầu những năm 1980 loại bỏ 94–96% và không dùng hóa chất; carbon dioxide từ đầu những năm 1970 loại bỏ 96–98% và giữ nguyên carbohydrate và protein nên ít đổi vị. Một cốc decaf khoảng 237ml vẫn còn khoảng 7mg caffeine.</desc>
  <rect width="640" height="354" fill="#f7efe6"/>
<text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#4a2c14" font-weight="bold">Khử caffeine bằng cách nào</text>
<rect x="20" y="60" width="580" height="52" fill="#8b5a2b" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Phương pháp</text>
<text x="178" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Từ khi nào</text>
<text x="308" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Loại bỏ</text>
<text x="418" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Điểm cần nhớ</text>
<rect x="20" y="112" width="580" height="52" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="143.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Dung môi</text>
<text x="178" y="143.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Đầu những năm 1900</text>
<text x="308" y="143.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">96–97%</text>
<text x="418" y="143.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Phổ biến nhất</text>
<rect x="20" y="164" width="580" height="52" fill="#fff8ec" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="195.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Nước Thụy Sĩ</text>
<text x="178" y="186.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Thương mại từ đầu</text>
<text x="178" y="204.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">những năm 1980</text>
<text x="308" y="195.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">94–96%</text>
<text x="418" y="195.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Không dùng hóa chất</text>
<rect x="20" y="216" width="580" height="52" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="247.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Carbon dioxide (CO₂)</text>
<text x="178" y="247.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Đầu những năm 1970</text>
<text x="308" y="247.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">96–98%</text>
<text x="418" y="238.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Giữ nguyên carbohydrate</text>
<text x="418" y="256.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">và protein nên ít đổi vị</text>
<rect x="20" y="60" width="580" height="208" fill="none" stroke="#4a2c14" stroke-width="2" rx="0"/>
<line x1="20" y1="112" x2="600" y2="112" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="164" x2="600" y2="164" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="216" x2="600" y2="216" stroke="#4a2c14" stroke-width="1"/>
<line x1="170" y1="60" x2="170" y2="268" stroke="#4a2c14" stroke-width="1"/>
<line x1="300" y1="60" x2="300" y2="268" stroke="#4a2c14" stroke-width="1"/>
<line x1="410" y1="60" x2="410" y2="268" stroke="#4a2c14" stroke-width="1"/>
<text x="320" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Một cốc decaf khoảng 237ml vẫn còn khoảng 7mg caffeine.</text>
<text x="320" y="292" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Chỉ khoảng 15% vị đắng đến từ caffeine.</text>
<text x="320" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Pha lọc bắt đầu từ 60 g/lít (18 g/300 g), nước 92–96°C, tỉ lệ 1:16,7.</text>
<text x="320" y="342" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Hình minh họa tự vẽ — không phải ảnh chụp thật</text>
</svg>
