<svg xmlns="http://www.w3.org/2000/svg" width="640" height="416" viewBox="0 0 640 416" role="img" aria-labelledby="t d">
  <title id="t">Ba vùng chè Shan Tuyết</title>
  <desc id="d">So sánh ba vùng chè Shan Tuyết: Suối Giàng ở xã Văn Chấn, Lào Cai, độ cao khoảng 1.400m, khoảng 293ha chè cổ với khoảng 80.000 cây trên 200 năm, quần thể 400 cây di sản năm 2016, khoảng 98% người H'Mông; Hoàng Su Phì 4.650ha chè với 1.200 cây di sản; Tà Xùa ở Sơn La với núi cao hơn 2.800m.</desc>
  <rect width="640" height="416" fill="#f7efe6"/>
<text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#4a2c14" font-weight="bold">Ba vùng chè Shan Tuyết</text>
<rect x="20" y="60" width="620" height="52" fill="#8b5a2b" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold"></text>
<text x="138" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Suối Giàng</text>
<text x="308" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Hoàng Su Phì</text>
<text x="478" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Tà Xùa</text>
<rect x="20" y="112" width="620" height="52" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="143.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Địa danh</text>
<text x="138" y="134.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Xã Văn Chấn,</text>
<text x="138" y="152.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">tỉnh Lào Cai</text>
<text x="308" y="134.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Hà Giang cũ, nay</text>
<text x="308" y="152.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">tỉnh Tuyên Quang</text>
<text x="478" y="134.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Tỉnh Sơn La,</text>
<text x="478" y="152.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">giáp Trạm Tấu</text>
<rect x="20" y="164" width="620" height="52" fill="#fff8ec" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="195.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Độ cao</text>
<text x="138" y="195.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Khoảng 1.400 m</text>
<text x="308" y="195.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Phìn Hồ khoảng 1.300 m</text>
<text x="478" y="195.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Núi cao &gt;2.800 m</text>
<rect x="20" y="216" width="620" height="52" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="247.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Quy mô</text>
<text x="138" y="238.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">~293 ha chè cổ;</text>
<text x="138" y="256.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">~80.000 cây trên 200 năm</text>
<text x="308" y="238.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">4.650 ha chè;</text>
<text x="308" y="256.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">3.600 ha thu hoạch</text>
<text x="478" y="238.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Chưa có số</text>
<text x="478" y="256.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">trong nguồn này</text>
<rect x="20" y="268" width="620" height="52" fill="#fff8ec" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="299.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Cây di sản</text>
<text x="138" y="299.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Quần thể 400 cây (2016)</text>
<text x="308" y="299.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">1.200 cây</text>
<text x="478" y="290.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Chưa có số</text>
<text x="478" y="308.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">trong nguồn này</text>
<rect x="20" y="320" width="620" height="52" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="351.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Cộng đồng</text>
<text x="138" y="351.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Khoảng 98% người H'Mông</text>
<text x="308" y="351.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Người Dao, Mông, Tày</text>
<text x="478" y="342.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Xem bài riêng</text>
<text x="478" y="360.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">về Tà Xùa</text>
<rect x="20" y="60" width="620" height="312" fill="none" stroke="#4a2c14" stroke-width="2" rx="0"/>
<line x1="20" y1="112" x2="640" y2="112" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="164" x2="640" y2="164" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="216" x2="640" y2="216" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="268" x2="640" y2="268" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="320" x2="640" y2="320" stroke="#4a2c14" stroke-width="1"/>
<line x1="130" y1="60" x2="130" y2="372" stroke="#4a2c14" stroke-width="1"/>
<line x1="300" y1="60" x2="300" y2="372" stroke="#4a2c14" stroke-width="1"/>
<line x1="470" y1="60" x2="470" y2="372" stroke="#4a2c14" stroke-width="1"/>
<text x="320" y="376" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Cây chè Tổ Suối Giàng trên 400 năm tuổi, mỗi vụ cho trên 20kg búp.</text>
<text x="320" y="404" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Bảng ba vùng chè Shan Tuyết: Suối Giàng, Hoàng Su Phì, Tà Xùa.</text>
</svg>
