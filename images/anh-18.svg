<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="t d">
  <title id="t">Túi lọc hay lá rời: so sánh 5 tiêu chí</title>
  <desc id="d">So sánh trà túi lọc và trà lá rời: túi lọc dùng fannings là vụn sau sàng lọc, màu đậm nhanh nhưng vị một chiều và hậu vị ngắn, hãm 2–5 phút, hiếm khi pha lại, chi phí 0,25 đô la một cốc; lá rời giữ lá nguyên, hương phức và vị ngọt hậu, pha 2–3g cho 200ml nước 80–95 độ C trong 2–3 phút, pha lại 2–3 lần, chi phí 0,15–0,35 đô la một cốc.</desc>
  <rect width="640" height="440" fill="#f7efe6"/>
<text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#4a2c14" font-weight="bold">Túi lọc hay lá rời: so sánh 5 tiêu chí</text>
<rect x="20" y="60" width="580" height="52" fill="#8b5a2b" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Tiêu chí</text>
<text x="138" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Trà túi lọc</text>
<text x="373" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Trà lá rời</text>
<rect x="20" y="112" width="580" height="52" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="143.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Nguyên liệu</text>
<text x="138" y="143.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Fannings, vụn sau sàng lọc</text>
<text x="373" y="134.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Lá/búp nguyên,</text>
<text x="373" y="152.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">nhìn thấy bằng mắt</text>
<rect x="20" y="164" width="580" height="52" fill="#fff8ec" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="195.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Hương vị</text>
<text x="138" y="186.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Màu đậm nhanh, vị một chiều,</text>
<text x="138" y="204.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">hậu vị ngắn</text>
<text x="373" y="186.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Hương phức, vị ngọt hậu,</text>
<text x="373" y="204.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">nở dần trong nước</text>
<rect x="20" y="216" width="580" height="52" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="247.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Cách pha</text>
<text x="138" y="238.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Thả túi, hãm 2–5 phút,</text>
<text x="138" y="256.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">không vắt</text>
<text x="373" y="238.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">2–3g/200ml, 80–95°C,</text>
<text x="373" y="256.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">hãm 2–3 phút</text>
<rect x="20" y="268" width="580" height="52" fill="#fff8ec" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="299.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Pha lại</text>
<text x="138" y="299.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Hiếm khi pha lại lần hai</text>
<text x="373" y="290.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Pha lại 2–3 lần</text>
<text x="373" y="308.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">mà vẫn còn hương</text>
<rect x="20" y="320" width="580" height="52" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="351.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Chi phí mỗi cốc</text>
<text x="138" y="342.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Túi lọc siêu thị:</text>
<text x="138" y="360.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">0,25 USD</text>
<text x="373" y="342.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Lá rời tầm trung:</text>
<text x="373" y="360.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">0,15–0,35 USD</text>
<rect x="20" y="60" width="580" height="312" fill="none" stroke="#4a2c14" stroke-width="2" rx="0"/>
<line x1="20" y1="112" x2="600" y2="112" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="164" x2="600" y2="164" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="216" x2="600" y2="216" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="268" x2="600" y2="268" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="320" x2="600" y2="320" stroke="#4a2c14" stroke-width="1"/>
<line x1="130" y1="60" x2="130" y2="372" stroke="#4a2c14" stroke-width="1"/>
<line x1="365" y1="60" x2="365" y2="372" stroke="#4a2c14" stroke-width="1"/>
<text x="320" y="376" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Giá theo thị trường Mỹ, chỉ để thấy cách tính.</text>
<text x="320" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Gói lá rời 100g, pha 3g/lần, pha lại 2 lần thì gần 100 cốc.</text>
<text x="320" y="428" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Hình minh họa được vẽ riêng cho website — không phải ảnh chụp thật</text>
</svg>
