<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="t d">
  <title id="t">Chọn ấm theo số người uống</title>
  <desc id="d">Chọn ấm theo số người: một người dùng ấm 100–150ml với 3–5g trà; 2–3 người dùng 150–200ml với 5–7g; gia đình 4–6 người dùng 200–300ml với 7–10g; văn phòng dùng bình lõi lọc 350–500ml với 3–5g; tiếp khách 8–15 người dùng ấm tích 800ml–1,2 lít với 10–15g trà mỗi lít.</desc>
  <rect width="640" height="460" fill="#f7efe6"/>
<text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#4a2c14" font-weight="bold">Chọn ấm theo số người uống</text>
<rect x="20" y="60" width="580" height="40" fill="#8b5a2b" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="85.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Hoàn cảnh</text>
<text x="168" y="85.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Số người</text>
<text x="258" y="85.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Dung tích</text>
<text x="428" y="85.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Lượng trà xanh</text>
<rect x="20" y="100" width="580" height="40" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="125.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Uống một mình</text>
<text x="168" y="125.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">1</text>
<text x="258" y="125.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">100–150 ml</text>
<text x="428" y="125.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">3–5 g, pha 4–5 nước</text>
<rect x="20" y="140" width="580" height="40" fill="#fff8ec" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="165.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Hai vợ chồng, bạn thân</text>
<text x="168" y="165.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">2–3</text>
<text x="258" y="165.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">150–200 ml</text>
<text x="428" y="165.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">5–7 g</text>
<rect x="20" y="180" width="580" height="40" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="205.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Gia đình sau bữa cơm</text>
<text x="168" y="205.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">4–6</text>
<text x="258" y="205.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">200–300 ml</text>
<text x="428" y="205.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">7–10 g</text>
<rect x="20" y="220" width="580" height="40" fill="#fff8ec" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="245.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Văn phòng</text>
<text x="168" y="245.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">1–2</text>
<text x="258" y="245.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">350–500 ml</text>
<text x="428" y="236.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">3–5 g, rút lõi</text>
<text x="428" y="254.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">sau 1–2 phút</text>
<rect x="20" y="260" width="580" height="40" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="285.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Tiếp khách đông</text>
<text x="168" y="285.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">8–15</text>
<text x="258" y="285.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">800 ml–1,2 lít</text>
<text x="428" y="285.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">10–15 g/lít</text>
<rect x="20" y="300" width="580" height="40" fill="#fff8ec" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="325.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Du lịch, dã ngoại</text>
<text x="168" y="325.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">1–4</text>
<text x="258" y="325.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">150–500 ml</text>
<text x="428" y="325.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Pha loãng 4–5 g/500 ml</text>
<rect x="20" y="340" width="580" height="40" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="365.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Người lớn tuổi</text>
<text x="168" y="365.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">1–3</text>
<text x="258" y="365.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">150–250 ml</text>
<text x="428" y="365.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">5–7 g</text>
<rect x="20" y="60" width="580" height="320" fill="none" stroke="#4a2c14" stroke-width="2" rx="0"/>
<line x1="20" y1="100" x2="600" y2="100" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="140" x2="600" y2="140" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="180" x2="600" y2="180" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="220" x2="600" y2="220" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="260" x2="600" y2="260" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="300" x2="600" y2="300" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="340" x2="600" y2="340" stroke="#4a2c14" stroke-width="1"/>
<line x1="160" y1="60" x2="160" y2="380" stroke="#4a2c14" stroke-width="1"/>
<line x1="250" y1="60" x2="250" y2="380" stroke="#4a2c14" stroke-width="1"/>
<line x1="420" y1="60" x2="420" y2="380" stroke="#4a2c14" stroke-width="1"/>
<text x="320" y="396" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Lượng rót ra chỉ khoảng 80% dung tích ghi trên ấm.</text>
<text x="320" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Ấm 200ml rót ra khoảng 160ml, đủ 4 chén 40ml.</text>
<text x="320" y="448" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Hình minh họa tự vẽ — không phải ảnh chụp thật</text>
</svg>
