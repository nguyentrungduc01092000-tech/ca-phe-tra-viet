<svg xmlns="http://www.w3.org/2000/svg" width="640" height="490" viewBox="0 0 640 490" role="img" aria-labelledby="t d">
  <title id="t">Bã cà phê phin dùng làm gì</title>
  <desc id="d">Bốn cách dùng bã cà phê phin: ủ phân với tỉ lệ 3 phần lá khô, 1 phần cỏ tươi, 1 phần bã, tối đa 20% đống ủ, đảo mỗi tuần; khử mùi bằng cách phơi khô bã đặt trong tủ lạnh và thay sau 2–3 tuần; cọ rửa nồi inox và chảo gang bằng bã hơi ẩm; hạn chế sên bằng dung dịch 1 phần nước với 1 phần cà phê pha đặc tưới lên đất.</desc>
  <rect width="640" height="490" fill="#f7efe6"/>
<text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#4a2c14" font-weight="bold">Bã cà phê phin dùng làm gì</text>
<rect x="20" y="60" width="290" height="150" fill="#e9f2e4" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="36" y="92" text-anchor="start" font-family="sans-serif" font-size="16" fill="#4a2c14" font-weight="bold">Ủ phân — cách dùng tốt nhất</text>
<text x="36" y="124" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">3 lá khô : 1 cỏ tươi : 1 bã;</text>
<text x="36" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">tối đa 20% đống ủ; đảo mỗi tuần</text>
<text x="36" y="184" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555">Xem chi tiết trong bài</text>
<rect x="330" y="60" width="290" height="150" fill="#fdf3e3" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="346" y="92" text-anchor="start" font-family="sans-serif" font-size="16" fill="#4a2c14" font-weight="bold">Khử mùi</text>
<text x="346" y="124" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Phơi khô bã, đặt trong bát nhỏ</text>
<text x="346" y="148" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">ở tủ lạnh; thay sau 2–3 tuần</text>
<text x="346" y="184" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555">Xem chi tiết trong bài</text>
<rect x="20" y="240" width="290" height="150" fill="#e8f0f5" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="36" y="272" text-anchor="start" font-family="sans-serif" font-size="16" fill="#4a2c14" font-weight="bold">Cọ rửa</text>
<text x="36" y="304" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Bã hơi ẩm cọ nồi inox, chảo gang;</text>
<text x="36" y="328" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">tránh đồ xốp và bề mặt dễ xước</text>
<text x="36" y="364" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555">Xem chi tiết trong bài</text>
<rect x="330" y="240" width="290" height="150" fill="#f5e8e8" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="346" y="272" text-anchor="start" font-family="sans-serif" font-size="16" fill="#4a2c14" font-weight="bold">Hạn chế sên</text>
<text x="346" y="304" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Tưới 1 nước : 1 cà phê pha đặc</text>
<text x="346" y="328" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">lên đất; phun lá 9 nước : 1 cà phê</text>
<text x="346" y="364" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555">Xem chi tiết trong bài</text>
<text x="320" y="428" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Bã đã pha có pH 6,5–6,8, gần trung tính; chứa khoảng 2% nitơ.</text>
<text x="320" y="452" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Dùng bã trong 2–3 tháng.</text>
<text x="320" y="478" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Hình minh họa tự vẽ — không phải ảnh chụp thật</text>
</svg>
