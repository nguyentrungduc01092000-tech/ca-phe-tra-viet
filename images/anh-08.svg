<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="t d">
  <title id="t">8 mức rang theo nhiệt độ hạt khi ra mẻ</title>
  <desc id="d">Thang 8 mức rang: Light 180–195 độ C, Cinnamon 195–200, New England 200–205, American khoảng 210, City 219–225, Full City 225–230, Vienna 230–240, French 240–245 độ C. Crack 1 khoảng 195–205 độ C, crack 2 khoảng 220–230 độ C.</desc>
  <rect width="640" height="480" fill="#f7efe6"/>
<text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#4a2c14" font-weight="bold">8 mức rang theo nhiệt độ hạt khi ra mẻ</text>
<text x="20" y="77" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14" font-weight="bold">Light</text>
<text x="20" y="94" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555">Rang sáng</text>
<rect x="214.0" y="62" width="66.0" height="26" fill="#e8c99a" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="288.0" y="80" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">180–195°C</text>
<text x="20" y="117" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14" font-weight="bold">Cinnamon</text>
<text x="20" y="134" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555">Rang sáng</text>
<rect x="280.0" y="102" width="22.0" height="26" fill="#d9a066" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="310.0" y="120" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">195–200°C</text>
<text x="20" y="157" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14" font-weight="bold">New England</text>
<text x="20" y="174" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555">Rang sáng</text>
<rect x="302.0" y="142" width="22.0" height="26" fill="#c98d4e" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="332.0" y="160" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">200–205°C</text>
<text x="20" y="197" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14" font-weight="bold">American</text>
<text x="20" y="214" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555">Rang vừa</text>
<rect x="346.0" y="182" width="6" height="26" fill="#a06a35" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="360.0" y="200" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">~210°C</text>
<text x="20" y="237" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14" font-weight="bold">City</text>
<text x="20" y="254" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555">Rang vừa</text>
<rect x="385.6" y="222" width="26.399999999999977" height="26" fill="#8b5a2b" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="420.0" y="240" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">219–225°C</text>
<text x="20" y="277" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14" font-weight="bold">Full City</text>
<text x="20" y="294" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555">Rang vừa</text>
<rect x="412.0" y="262" width="22.0" height="26" fill="#7a4a22" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="442.0" y="280" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">225–230°C</text>
<text x="20" y="317" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14" font-weight="bold">Vienna</text>
<text x="20" y="334" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555">Rang đậm</text>
<rect x="434.0" y="302" width="44.0" height="26" fill="#5a3018" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="486.0" y="320" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">230–240°C</text>
<text x="20" y="357" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14" font-weight="bold">French</text>
<text x="20" y="374" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555">Rang đậm</text>
<rect x="478.0" y="342" width="22.0" height="26" fill="#3b2410" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="508.0" y="360" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">240–245°C</text>
<text x="170" y="390" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555">170°C</text>
<text x="500" y="390" text-anchor="end" font-family="sans-serif" font-size="12" fill="#555">245°C</text>
<text x="320" y="416" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Crack 1 khoảng 195–205°C; crack 2 khoảng 220–230°C.</text>
<text x="320" y="440" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Rang đậm dùng sau 2–4 ngày; rang sáng để 5–10 ngày cho khí thoát bớt.</text>
<text x="320" y="468" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Hình minh họa tự vẽ — không phải ảnh chụp thật</text>
</svg>
