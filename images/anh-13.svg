<svg xmlns="http://www.w3.org/2000/svg" width="640" height="396" viewBox="0 0 640 396" role="img" aria-labelledby="t d">
  <title id="t">Cà phê dừa: hai cách làm</title>
  <desc id="d">Hai cách làm cà phê dừa: cách máy espresso cho 1 ly 350–400ml dùng espresso 36–40g, cốt dừa 40–60ml, sữa đặc 10–15ml, đá 120–150g, xay 20–40 giây; cách cốt phin cho 2 ly dùng phin 25g với 120ml nước thu 60–70ml cốt, 200ml cốt dừa, 60ml sữa đặc, 350g đá.</desc>
  <rect width="640" height="396" fill="#f7efe6"/>
<text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#4a2c14" font-weight="bold">Cà phê dừa: hai cách làm</text>
<rect x="20" y="60" width="580" height="48" fill="#8b5a2b" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="89.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold"></text>
<text x="138" y="89.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Cách 1: máy espresso (1 ly 350–400ml)</text>
<text x="373" y="89.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Cách 2: cốt phin (2 ly)</text>
<rect x="20" y="108" width="580" height="48" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="137.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Cà phê</text>
<text x="138" y="128.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Espresso 36–40g</text>
<text x="138" y="146.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">(18–20g bột)</text>
<text x="373" y="128.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Phin 25g, 120ml nước,</text>
<text x="373" y="146.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">thu 60–70ml</text>
<rect x="20" y="156" width="580" height="48" fill="#fff8ec" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="185.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Cốt dừa</text>
<text x="138" y="185.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">40–60ml</text>
<text x="373" y="185.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">200ml</text>
<rect x="20" y="204" width="580" height="48" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="233.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Sữa đặc</text>
<text x="138" y="233.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">10–15ml</text>
<text x="373" y="233.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">60ml (30ml mỗi ly)</text>
<rect x="20" y="252" width="580" height="48" fill="#fff8ec" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="281.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Đá</text>
<text x="138" y="281.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">120–150g</text>
<text x="373" y="281.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">350g</text>
<rect x="20" y="300" width="580" height="48" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="329.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Xay</text>
<text x="138" y="329.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">20–40 giây</text>
<text x="373" y="329.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Xay tới mịn như tuyết</text>
<rect x="20" y="60" width="580" height="288" fill="none" stroke="#4a2c14" stroke-width="2" rx="0"/>
<line x1="20" y1="108" x2="600" y2="108" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="156" x2="600" y2="156" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="204" x2="600" y2="204" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="252" x2="600" y2="252" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="300" x2="600" y2="300" stroke="#4a2c14" stroke-width="1"/>
<line x1="130" y1="60" x2="130" y2="348" stroke="#4a2c14" stroke-width="1"/>
<line x1="365" y1="60" x2="365" y2="348" stroke="#4a2c14" stroke-width="1"/>
<text x="320" y="356" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Cách 2 làm trong 25 phút: 15 phút chuẩn bị + 10 phút pha phin.</text>
<text x="320" y="384" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Hình minh họa tự vẽ — không phải ảnh chụp thật</text>
</svg>
