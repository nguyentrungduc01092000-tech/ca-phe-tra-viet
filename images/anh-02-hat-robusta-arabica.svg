<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">So sánh hình dáng hạt Arabica và hạt Robusta</title>
  <desc id="d">Hình minh họa được vẽ riêng cho website. Hạt Arabica dài, hơi dẹt, rãnh giữa cong nhẹ như chữ S. Hạt Robusta tròn hơn, nhỏ hơn, mặt hạt lồi hơn, rãnh giữa thẳng. Đây chỉ là dấu hiệu nhận biết tương đối; sau khi rang đậm, hạt nào cũng sẫm màu và khó phân biệt hơn.</desc>
  <rect width="640" height="360" fill="#f7efe6"/>
  <text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4a2c14">Nhận biết hạt bằng mắt thường</text>
  <g>
    <ellipse cx="180" cy="170" rx="90" ry="130" fill="#8b5a2b" stroke="#4a2c14" stroke-width="3"/>
    <path d="M 180 50 Q 230 170 180 290" fill="none" stroke="#f7efe6" stroke-width="6"/>
    <text x="180" y="60" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4a2c14">Arabica</text>
    <text x="180" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4a2c14">Dài, dẹt — rãnh cong</text>
    <ellipse cx="460" cy="170" rx="95" ry="105" fill="#6b4423" stroke="#4a2c14" stroke-width="3"/>
    <line x1="460" y1="75" x2="460" y2="265" stroke="#f7efe6" stroke-width="6"/>
    <text x="460" y="60" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4a2c14">Robusta</text>
    <text x="460" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4a2c14">Tròn, nhỏ — rãnh thẳng</text>
  </g>
  <text x="320" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Hình minh họa được vẽ riêng cho website — không phải ảnh chụp thật</text>
</svg>
