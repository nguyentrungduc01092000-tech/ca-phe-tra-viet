<svg xmlns="http://www.w3.org/2000/svg" width="640" height="370" viewBox="0 0 640 370" role="img" aria-labelledby="t d">
  <title id="t">Cold brew: uống ngay hay làm cô đặc</title>
  <desc id="d">Hai cách làm cold brew: uống ngay tỉ lệ 1:8–1:10, ủ 12–24 giờ, lọc xong uống ngay với đá, ngon nhất 2–3 ngày đầu; cô đặc tỉ lệ 1:4–1:5, ủ ngăn mát 12–18 giờ, pha loãng 1 phần cốt với 2 phần nước, để tủ lạnh tối đa 7 ngày.</desc>
  <rect width="640" height="370" fill="#f7efe6"/>
<text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#4a2c14" font-weight="bold">Cold brew: uống ngay hay làm cô đặc</text>
<rect x="20" y="60" width="580" height="52" fill="#8b5a2b" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold"></text>
<text x="138" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Uống ngay</text>
<text x="373" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Cô đặc</text>
<rect x="20" y="112" width="580" height="52" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="143.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Tỉ lệ</text>
<text x="138" y="134.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">1:8–1:10</text>
<text x="138" y="152.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">100g : 800ml–1 lít</text>
<text x="373" y="134.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">1:4–1:5</text>
<text x="373" y="152.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">100g : 400–500ml</text>
<rect x="20" y="164" width="580" height="52" fill="#fff8ec" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="195.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Thời gian ủ</text>
<text x="138" y="195.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">12–24 giờ; bắt đầu 14–16 giờ</text>
<text x="373" y="186.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">12–24 giờ;</text>
<text x="373" y="204.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">ngăn mát 12–18 giờ</text>
<rect x="20" y="216" width="580" height="52" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="247.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Cách dùng</text>
<text x="138" y="247.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Lọc xong uống ngay với đá</text>
<text x="373" y="238.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Pha loãng 1 cốt : 2 nước,</text>
<text x="373" y="256.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">chỉnh dần đến 1 : 4</text>
<rect x="20" y="268" width="580" height="52" fill="#fff8ec" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="299.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Bảo quản</text>
<text x="138" y="299.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Ngon nhất 2–3 ngày đầu</text>
<text x="373" y="290.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Tủ lạnh tối đa 7 ngày</text>
<text x="373" y="308.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">(một nguồn ghi 1–2 tuần)</text>
<rect x="20" y="60" width="580" height="260" fill="none" stroke="#4a2c14" stroke-width="2" rx="0"/>
<line x1="20" y1="112" x2="600" y2="112" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="164" x2="600" y2="164" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="216" x2="600" y2="216" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="268" x2="600" y2="268" stroke="#4a2c14" stroke-width="1"/>
<line x1="130" y1="60" x2="130" y2="320" stroke="#4a2c14" stroke-width="1"/>
<line x1="365" y1="60" x2="365" y2="320" stroke="#4a2c14" stroke-width="1"/>
<text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Cả hai cách đều xay rất thô và dùng nước lạnh hoặc nước ở nhiệt độ phòng.</text>
<text x="320" y="358" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Hình minh họa được vẽ riêng cho website — không phải ảnh chụp thật</text>
</svg>
