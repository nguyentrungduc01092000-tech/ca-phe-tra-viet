<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">Sơ đồ pha cà phê phin: 25g bột, 30ml nước ủ, 50ml nước châm, thu 40–45ml cốt</title>
  <desc id="d">Phin nhỏ đặt trên ly. Lớp bột cà phê 25g ở đáy phin, rót 30ml nước nóng để ủ 2–3 phút, rồi châm thêm 50ml nước. Tổng 80ml nước, cà phê nhỏ giọt xuống ly, thu được khoảng 40–45ml cốt.</desc>
  <rect width="640" height="360" fill="#f7efe6"/>
  <text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4a2c14">Pha phin nhỏ: 25g bột — 80ml nước — 40–45ml cốt</text>
  <g font-family="sans-serif" font-size="16" fill="#4a2c14">
    <rect x="230" y="70" width="180" height="30" fill="#d9a066" stroke="#4a2c14" stroke-width="2"/>
    <text x="320" y="91" text-anchor="middle">Nắp phin</text>
    <rect x="230" y="100" width="180" height="60" fill="#bfe3f0" stroke="#4a2c14" stroke-width="2"/>
    <text x="320" y="126" text-anchor="middle">Nước châm thêm: 50ml</text>
    <text x="320" y="150" text-anchor="middle" font-size="13" fill="#555">sau khi ủ 2–3 phút</text>
    <rect x="230" y="160" width="180" height="50" fill="#8b5a2b" stroke="#4a2c14" stroke-width="2"/>
    <text x="320" y="182" text-anchor="middle" fill="#fff">Bột cà phê: 25g</text>
    <text x="320" y="202" text-anchor="middle" fill="#fff" font-size="13">Ủ với 30ml nước nóng</text>
    <rect x="230" y="210" width="180" height="12" fill="#d9a066" stroke="#4a2c14" stroke-width="2"/>
    <text x="320" y="240" text-anchor="middle" font-size="13" fill="#555">Đáy phin đục lỗ — cà phê nhỏ giọt</text>
    <rect x="250" y="255" width="140" height="70" fill="#fff" stroke="#4a2c14" stroke-width="2"/>
    <rect x="250" y="300" width="140" height="25" fill="#3b2410"/>
    <text x="320" y="292" text-anchor="middle">Ly hứng cốt</text>
  </g>
  <text x="470" y="130" font-family="sans-serif" font-size="15" fill="#4a2c14">1. Ủ: 30ml, 2–3 phút</text>
  <text x="470" y="160" font-family="sans-serif" font-size="15" fill="#4a2c14">2. Châm: 50ml</text>
  <text x="470" y="190" font-family="sans-serif" font-size="15" fill="#4a2c14">3. Tổng: 80ml nước</text>
  <text x="470" y="220" font-family="sans-serif" font-size="15" fill="#4a2c14">4. Thu: 40–45ml cốt</text>
  <text x="470" y="250" font-family="sans-serif" font-size="15" fill="#4a2c14">Nước: 90–96°C</text>
  <text x="320" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Sơ đồ phin cà phê 25 g bột, 80 ml nước.</text>
</svg>
