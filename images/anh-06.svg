<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="t d">
  <title id="t">Phin lớn: bột, nước và cốt thu được</title>
  <desc id="d">Bảng quy đổi ba cỡ phin: phin nhỏ 25g bột với 80ml nước thu 40–45ml cốt cho 1 ly; phin lớn 100g bột với 410ml nước thu 160–200ml cốt cho 4–5 ly; phin lớn 200g bột với 750ml nước thu 360–400ml cốt cho 8–10 ly.</desc>
  <rect width="640" height="350" fill="#f7efe6"/>
<text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#4a2c14" font-weight="bold">Phin lớn: bột, nước và cốt thu được</text>
<rect x="20" y="60" width="580" height="40" fill="#8b5a2b" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="85.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Cỡ phin</text>
<text x="138" y="85.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Bột</text>
<text x="218" y="85.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Nước</text>
<text x="298" y="85.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Cốt thu được</text>
<text x="448" y="85.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Số ly (mỗi ly ~40ml)</text>
<rect x="20" y="100" width="580" height="40" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="125.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Phin nhỏ</text>
<text x="138" y="125.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">25g</text>
<text x="218" y="125.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">80ml</text>
<text x="298" y="125.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">40–45ml</text>
<text x="448" y="125.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">1 ly</text>
<rect x="20" y="140" width="580" height="40" fill="#fff8ec" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="165.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Phin lớn 100g</text>
<text x="138" y="165.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">100g</text>
<text x="218" y="165.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">410ml</text>
<text x="298" y="165.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">160–200ml</text>
<text x="448" y="165.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">4–5 ly</text>
<rect x="20" y="180" width="580" height="40" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="205.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Phin lớn 200g</text>
<text x="138" y="205.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">200g</text>
<text x="218" y="205.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">750ml</text>
<text x="298" y="205.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">360–400ml</text>
<text x="448" y="205.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">8–10 ly</text>
<rect x="20" y="60" width="580" height="160" fill="none" stroke="#4a2c14" stroke-width="2" rx="0"/>
<line x1="20" y1="100" x2="600" y2="100" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="140" x2="600" y2="140" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="180" x2="600" y2="180" stroke="#4a2c14" stroke-width="1"/>
<line x1="130" y1="60" x2="130" y2="220" stroke="#4a2c14" stroke-width="1"/>
<line x1="210" y1="60" x2="210" y2="220" stroke="#4a2c14" stroke-width="1"/>
<line x1="290" y1="60" x2="290" y2="220" stroke="#4a2c14" stroke-width="1"/>
<line x1="440" y1="60" x2="440" y2="220" stroke="#4a2c14" stroke-width="1"/>
<text x="320" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Phin 100g: ủ 160ml nước, 7–10 phút; châm thêm 250ml; nhỏ giọt 8–12 phút.</text>
<text x="320" y="266" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Phin 200g: ủ 250ml nước, 10–15 phút; châm thêm 500ml.</text>
<text x="320" y="292" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Nước bắt đầu ở khoảng 93–96°C.</text>
<text x="320" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Mỗi ly thêm khoảng 10ml đường hoặc 20ml sữa đặc.</text>
<text x="320" y="338" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Bảng phin lớn: lượng bột, nước và cốt thu được.</text>
</svg>
