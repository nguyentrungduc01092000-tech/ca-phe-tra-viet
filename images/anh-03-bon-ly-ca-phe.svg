<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">Bốn ly cà phê cùng nền cốt phin: sữa đá, bạc xỉu, trứng, affogato</title>
  <desc id="d">Bốn ly đặt cạnh nhau với tỉ lệ thành phần khác nhau: cà phê sữa đá nhiều cốt và 2–3 muỗng sữa đặc; bạc xỉu nhiều sữa, ít cà phê, phin riêng 15g bột với 50ml nước; cà phê trứng có lớp kem trứng bông phủ trên cốt đặc 40ml; affogato là cà phê nóng đặc rót lên 1–2 viên kem lạnh.</desc>
  <rect width="640" height="360" fill="#f7efe6"/>
  <text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#4a2c14">Bốn ly, một nền cốt phin</text>
  <g font-family="sans-serif" font-size="14" fill="#4a2c14">
    <rect x="40" y="90" width="120" height="180" fill="#fff" stroke="#4a2c14" stroke-width="2"/>
    <rect x="40" y="150" width="120" height="60" fill="#3b2410"/>
    <rect x="40" y="210" width="120" height="60" fill="#e8c39e"/>
    <text x="100" y="300" text-anchor="middle" font-weight="bold">Cà phê sữa đá</text>
    <text x="100" y="322" text-anchor="middle" font-size="12">Cốt đậm + 2–3 muỗng sữa đặc</text>
    <rect x="190" y="90" width="120" height="180" fill="#fff" stroke="#4a2c14" stroke-width="2"/>
    <rect x="190" y="230" width="120" height="40" fill="#3b2410"/>
    <rect x="190" y="110" width="120" height="120" fill="#f2e3c9"/>
    <text x="250" y="300" text-anchor="middle" font-weight="bold">Bạc xỉu</text>
    <text x="250" y="322" text-anchor="middle" font-size="12">Nhiều sữa, ít cà phê</text>
    <rect x="340" y="90" width="120" height="180" fill="#fff" stroke="#4a2c14" stroke-width="2"/>
    <rect x="340" y="90" width="120" height="70" fill="#f5d76e"/>
    <rect x="340" y="160" width="120" height="110" fill="#3b2410"/>
    <text x="400" y="300" text-anchor="middle" font-weight="bold">Cà phê trứng</text>
    <text x="400" y="322" text-anchor="middle" font-size="12">Kem trứng phủ trên cốt 40ml</text>
    <rect x="490" y="90" width="120" height="180" fill="#fff" stroke="#4a2c14" stroke-width="2"/>
    <circle cx="550" cy="140" r="35" fill="#fff8e7" stroke="#4a2c14" stroke-width="2"/>
    <rect x="490" y="180" width="120" height="90" fill="#3b2410"/>
    <text x="550" y="300" text-anchor="middle" font-weight="bold">Affogato</text>
    <text x="550" y="322" text-anchor="middle" font-size="12">Cà phê nóng + kem lạnh</text>
  </g>
  <text x="320" y="350" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Sơ đồ bốn ly cà phê làm từ một nền cốt phin.</text>
</svg>
