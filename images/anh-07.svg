<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="t d">
  <title id="t">Phin đá: từ cốt đậm tới ly lạnh</title>
  <desc id="d">Quy trình năm bước: pha cốt đậm 25g bột với 95–100ml nước thu 50ml cốt; làm nguội cốt trong tô nước mát 1–2 phút; cho 50ml cốt, 10ml nước đường và 130–150g đá vào shaker; lắc dứt khoát 8–10 giây; rót ra ly và nếm lại sau 2–3 phút.</desc>
  <rect width="640" height="480" fill="#f7efe6"/>
<text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#4a2c14" font-weight="bold">Phin đá: từ cốt đậm tới ly lạnh</text>
<rect x="60" y="60" width="520" height="56" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="80" y="84" text-anchor="start" font-family="sans-serif" font-size="16" fill="#4a2c14" font-weight="bold">1. Pha cốt đậm</text>
<text x="80" y="106" text-anchor="start" font-family="sans-serif" font-size="14" fill="#555">25g bột, 95–100ml nước nóng, thu khoảng 50ml cốt</text>
<line x1="320" y1="116" x2="320" y2="136" stroke="#4a2c14" stroke-width="2"/>
<polygon points="320,138 312,126 328,126" fill="#4a2c14"/>
<rect x="60" y="138" width="520" height="56" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="80" y="162" text-anchor="start" font-family="sans-serif" font-size="16" fill="#4a2c14" font-weight="bold">2. Làm nguội cốt</text>
<text x="80" y="184" text-anchor="start" font-family="sans-serif" font-size="14" fill="#555">Đặt ca cốt vào tô nước mát 1–2 phút, khuấy nhẹ</text>
<line x1="320" y1="194" x2="320" y2="214" stroke="#4a2c14" stroke-width="2"/>
<polygon points="320,216 312,204 328,204" fill="#4a2c14"/>
<rect x="60" y="216" width="520" height="56" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="80" y="240" text-anchor="start" font-family="sans-serif" font-size="16" fill="#4a2c14" font-weight="bold">3. Cho vào shaker</text>
<text x="80" y="262" text-anchor="start" font-family="sans-serif" font-size="14" fill="#555">50ml cốt + 10ml nước đường + 130–150g đá viên cứng</text>
<line x1="320" y1="272" x2="320" y2="292" stroke="#4a2c14" stroke-width="2"/>
<polygon points="320,294 312,282 328,282" fill="#4a2c14"/>
<rect x="60" y="294" width="520" height="56" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="80" y="318" text-anchor="start" font-family="sans-serif" font-size="16" fill="#4a2c14" font-weight="bold">4. Lắc dứt khoát</text>
<text x="80" y="340" text-anchor="start" font-family="sans-serif" font-size="14" fill="#555">Lắc 8–10 giây, tới khi thân shaker lạnh rõ</text>
<line x1="320" y1="350" x2="320" y2="370" stroke="#4a2c14" stroke-width="2"/>
<polygon points="320,372 312,360 328,360" fill="#4a2c14"/>
<rect x="60" y="372" width="520" height="56" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="80" y="396" text-anchor="start" font-family="sans-serif" font-size="16" fill="#4a2c14" font-weight="bold">5. Rót ra ly</text>
<text x="80" y="418" text-anchor="start" font-family="sans-serif" font-size="14" fill="#555">Rót toàn bộ cùng đá; nếm lại sau 2–3 phút</text>
<text x="320" y="468" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Hình minh họa tự vẽ — không phải ảnh chụp thật</text>
</svg>
