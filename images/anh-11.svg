<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" role="img" aria-labelledby="t d">
  <title id="t">Cà phê muối: hai công thức đã kiểm chứng</title>
  <desc id="d">Hai công thức cà phê muối: công thức kem whipping dùng phin 20g bột với 100ml nước thu khoảng 80ml cốt, kem 60ml whipping với 20ml sữa đặc và 0,75–1,5g muối; công thức kem topping pha sẵn dùng phin 25g bột thu 45–55ml cốt, mẻ kem 300ml cho 8 ly, mỗi ly 35–40ml kem với khoảng 0,3g muối.</desc>
  <rect width="640" height="390" fill="#f7efe6"/>
<text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#4a2c14" font-weight="bold">Cà phê muối: hai công thức đã kiểm chứng</text>
<rect x="20" y="60" width="580" height="52" fill="#8b5a2b" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold"></text>
<text x="138" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Công thức 1: kem whipping</text>
<text x="373" y="91.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Công thức 2: kem topping</text>
<rect x="20" y="112" width="580" height="52" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="143.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Cốt phin</text>
<text x="138" y="134.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">20g bột, 100ml nước</text>
<text x="138" y="152.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">90–96°C, thu ~80ml</text>
<text x="373" y="134.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">25g bột, 95–100ml nước</text>
<text x="373" y="152.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">thu 45–55ml</text>
<rect x="20" y="164" width="580" height="52" fill="#fff8ec" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="195.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Kem</text>
<text x="138" y="186.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">60ml whipping + 20ml</text>
<text x="138" y="204.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">sữa đặc + muối 0,75–1,5g</text>
<text x="373" y="186.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Mẻ 300ml cho 8 ly;</text>
<text x="373" y="204.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">mỗi ly 35–40ml, muối ~0,3g/ly</text>
<rect x="20" y="216" width="580" height="52" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="247.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Sữa đặc</text>
<text x="138" y="247.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">20ml, cho vào kem</text>
<text x="373" y="247.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">20–25ml, khuấy vào cốt nóng</text>
<rect x="20" y="268" width="580" height="52" fill="#fff8ec" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="28" y="299.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Đá</text>
<text x="138" y="299.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Đầy khoảng 2/3 ly</text>
<text x="373" y="299.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">100–140g đá viên cứng</text>
<rect x="20" y="60" width="580" height="260" fill="none" stroke="#4a2c14" stroke-width="2" rx="0"/>
<line x1="20" y1="112" x2="600" y2="112" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="164" x2="600" y2="164" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="216" x2="600" y2="216" stroke="#4a2c14" stroke-width="1"/>
<line x1="20" y1="268" x2="600" y2="268" stroke="#4a2c14" stroke-width="1"/>
<line x1="130" y1="60" x2="130" y2="320" stroke="#4a2c14" stroke-width="1"/>
<line x1="365" y1="60" x2="365" y2="320" stroke="#4a2c14" stroke-width="1"/>
<text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Muối nằm trong kem, không cho vào cà phê.</text>
<text x="320" y="354" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">1/4 muỗng cà phê muối nặng khoảng 1,5g.</text>
<text x="320" y="378" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Hình minh họa được vẽ riêng cho website — không phải ảnh chụp thật</text>
</svg>
