<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" role="img" aria-labelledby="t d">
  <title id="t">Ba loại trà hoa: sen, nhài, cúc</title>
  <desc id="d">So sánh ba loại trà hoa: trà sen 5g cho 150ml nước 80–85 độ C hãm 45–60 giây, có caffeine, ướp lặp 7–9 lượt; trà nhài 4–5g cho 150ml nước khoảng 80 độ C hãm 40–60 giây, có caffeine, ướp lặp tới 6–7 lượt; trà hoa cúc 5–8 bông cho 250ml nước 90–95 độ C ủ 4–5 phút, không có caffeine.</desc>
  <rect width="640" height="450" fill="#f7efe6"/>
<text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#4a2c14" font-weight="bold">Ba loại trà hoa: sen, nhài, cúc</text>
