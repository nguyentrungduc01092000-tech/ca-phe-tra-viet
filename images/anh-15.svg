<text x="138" y="131.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Ướp hoa, nền trà xanh</text>
<text x="308" y="131.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Ướp hoa, nền trà xanh</text>
<text x="478" y="122.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">Thảo mộc,</text>
<text x="478" y="140.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">không lá trà</text>
