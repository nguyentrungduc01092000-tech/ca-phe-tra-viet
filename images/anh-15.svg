<text x="478" y="166.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">5–8 bông (2–3g)</text>
<text x="478" y="184.0" text-anchor="start" font-family="sans-serif" font-size="14" fill="#4a2c14">/ 250ml</text>
