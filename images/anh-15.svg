<text x="320" y="386" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Trà sen: 1.000–1.400 bông cho 1kg trà.</text>
<text x="320" y="410" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Trà sen Tây Hồ 90.000đ một bông (~15g).</text>
<text x="320" y="438" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Bảng ba loại trà hoa: sen, nhài, cúc.</text>
