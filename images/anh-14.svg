<svg xmlns="http://www.w3.org/2000/svg" width="640" height="504" viewBox="0 0 640 504" role="img" aria-labelledby="t d">
  <title id="t">Trân châu đường đen: bốn bước tới ly hoàn chỉnh</title>
  <desc id="d">Bốn bước làm sữa tươi trân châu đường đen: nhồi 100g bột năng với 100g bột gạo rồi vo viên khoảng 0,5cm; luộc tới khi viên nổi lên rồi vớt vào nước lạnh; ngâm trong nước đường đen đun sôi 5–7 phút trong 30 phút đến 1 giờ; ghép ly 500ml với 80g trân châu, 200ml sữa tươi, 150g đá và bọt Dalgona tỉ lệ 1:1:1.</desc>
  <rect width="640" height="504" fill="#f7efe6"/>
<text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#4a2c14" font-weight="bold">Trân châu đường đen: bốn bước tới ly hoàn chỉnh</text>
<rect x="60" y="60" width="520" height="56" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="80" y="84" text-anchor="start" font-family="sans-serif" font-size="16" fill="#4a2c14" font-weight="bold">1. Nhồi bột và vo viên</text>
<text x="80" y="106" text-anchor="start" font-family="sans-serif" font-size="13" fill="#555">100g bột năng + 100g bột gạo; vo viên khoảng 0,5cm</text>
<line x1="320" y1="116" x2="320" y2="136" stroke="#4a2c14" stroke-width="2"/>
<polygon points="320,138 312,126 328,126" fill="#4a2c14"/>
<rect x="60" y="138" width="520" height="56" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="80" y="162" text-anchor="start" font-family="sans-serif" font-size="16" fill="#4a2c14" font-weight="bold">2. Luộc trân châu</text>
<text x="80" y="180" text-anchor="start" font-family="sans-serif" font-size="13" fill="#555">Luộc tới khi viên nổi lên, vớt vào nước lạnh;</text>
<text x="80" y="196" text-anchor="start" font-family="sans-serif" font-size="13" fill="#555">ủ thêm 20 phút nếu muốn chín hẳn</text>
<line x1="320" y1="194" x2="320" y2="214" stroke="#4a2c14" stroke-width="2"/>
<polygon points="320,216 312,204 328,204" fill="#4a2c14"/>
<rect x="60" y="216" width="520" height="56" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="80" y="240" text-anchor="start" font-family="sans-serif" font-size="16" fill="#4a2c14" font-weight="bold">3. Ngâm đường đen</text>
<text x="80" y="262" text-anchor="start" font-family="sans-serif" font-size="13" fill="#555">Đường đen còn lại + 150ml nước, đun sôi 5–7 phút, ngâm 30 phút–1 giờ</text>
<line x1="320" y1="272" x2="320" y2="292" stroke="#4a2c14" stroke-width="2"/>
<polygon points="320,294 312,282 328,282" fill="#4a2c14"/>
<rect x="60" y="294" width="520" height="56" fill="#ffffff" stroke="#4a2c14" stroke-width="1.5" rx="0"/>
<text x="80" y="318" text-anchor="start" font-family="sans-serif" font-size="16" fill="#4a2c14" font-weight="bold">4. Ghép ly 500ml</text>
<text x="80" y="340" text-anchor="start" font-family="sans-serif" font-size="13" fill="#555">80g trân châu + 200ml sữa tươi + 150g đá + bọt Dalgona 1:1:1</text>
<text x="320" y="378" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Bọt Dalgona 1:1:1 — 2 muỗng cà phê hòa tan (~4g)</text>
<text x="320" y="402" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">+ 2 muỗng đường (~8g) + 2 muỗng nước nóng (~10ml), đánh máy 2–5 phút.</text>
<text x="320" y="426" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#555">Trân châu bảo quản ngăn mát tối đa 5 ngày.</text>
<text x="320" y="492" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">Hình minh họa tự vẽ — không phải ảnh chụp thật</text>
</svg>
